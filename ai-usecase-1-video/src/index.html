<script>
  // Deterministic player: every frame is a pure function of t (seconds).
  // ?t=12.5 freezes a frame; ?play=1 previews in real time; ?subs=1 shows subtitles.
  E.init();
  const q = new URLSearchParams(location.search);
  if (q.get('play')) {
    const t0 = performance.now() - (parseFloat(q.get('t') || '0') * 1000);
    const tick = () => { E.seek(Math.min(E.total, (performance.now() - t0) / 1000)); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  } else {
    E.seek(parseFloat(q.get('t') || '0'));
  }
</script>
