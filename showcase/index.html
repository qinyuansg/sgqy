<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050b14" />
  <title>Product Showcase</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    { "imports": {
      "three": "./js/vendor/three/build/three.module.min.js",
      "three/addons/": "./js/vendor/three/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="backdrop-image" id="backdrop-image"></div>
    <div class="backdrop-glow"></div>
    <div class="backdrop-floor"></div>
    <canvas id="backdrop-canvas"></canvas>
  </div>

  <!-- The 3D canvas lives behind both screens; it is only visible in the viewer. -->
  <div class="stage" id="stage">
    <div class="hotspot-layer" id="hotspot-layer"></div>
  </div>

  <!-- Screen 1: pick a product -->
  <main class="screen home" id="screen-home">
    <header class="home-header">
      <h1 class="home-title" id="home-title"></h1>
      <p class="home-subtitle" id="home-subtitle"></p>
    </header>
    <div class="lineup" id="lineup"></div>
    <footer class="home-footer" id="home-footer"></footer>
  </main>

  <!-- Screen 2: inspect one product -->
  <section class="screen viewer" id="screen-viewer" hidden>
    <header class="viewer-top">
      <div class="viewer-bar">
        <button class="round-btn" id="btn-back" aria-label="Back to all products">
          <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
        </button>
        <button class="pill-btn" id="btn-next">
          <span id="btn-next-label">NEXT</span>
          <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        </button>
      </div>
      <h1 class="viewer-title" id="viewer-title"></h1>
      <p class="viewer-desc" id="viewer-desc"></p>
      <button class="reset-btn" id="btn-reset">
        <span id="btn-reset-label">RESET VIEW</span>
        <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </header>

    <div class="viewer-bottom" id="viewer-bottom">
      <div class="explore-hint" id="explore-hint">
        <svg viewBox="0 0 24 24"><path d="M9 11V5a2 2 0 0 1 4 0v6"/><path d="M13 10a2 2 0 0 1 4 0v2"/><path d="M17 11a2 2 0 0 1 4 0v4a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.6-2.8L4 14.5a1.8 1.8 0 0 1 3-2L9 15"/></svg>
        <span id="explore-hint-text">TAP TO EXPLORE</span>
      </div>
      <div class="feature-row" id="feature-row"></div>
    </div>

    <article class="feature-card" id="feature-card" hidden>
      <button class="card-toggle" id="card-toggle" aria-label="Expand description">
        <svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg>
      </button>
      <div class="card-body">
        <div class="card-icon" id="card-icon"></div>
        <div class="card-text">
          <h2 id="card-title"></h2>
          <div class="card-desc" id="card-desc"></div>
        </div>
      </div>
      <nav class="card-nav">
        <button class="card-arrow" id="card-prev" aria-label="Previous feature">
          <svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>
        </button>
        <div class="card-dots" id="card-dots"></div>
        <button class="card-arrow" id="card-next" aria-label="Next feature">
          <svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg>
        </button>
      </nav>
    </article>
  </section>

  <div class="loading" id="loading" hidden><div class="spinner"></div><span>Loading…</span></div>
  <div class="edit-panel" id="edit-panel" hidden></div>
  <div class="fatal" id="fatal" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
