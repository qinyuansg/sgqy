<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AgilFence UI flow v2 — AGIL® Secure V11</title>
<link rel="stylesheet" href="css/film.css">
</head>
<body>
<div id="stage"><div id="bg"><div class="aur"></div><div class="grid"></div><div class="vignette"></div></div></div>
<script>
  // Cut variants: ?cut=<name> (or a window.CUT set before this script) picks the film. The default cut, operator,
  // loads js/timeline.js and then js/scenes/flow.js + js/chrome.js; any other cut loads js/timeline-<name>.js,
  // whose "scripts" list names its own scene files (js/scenes/<name>/*.js). document.write keeps the scripts
  // parser-blocking, so they run in order before the player below, exactly as static tags would.
  (function () {
    const q = new URLSearchParams(location.search);
    const cut = String(q.get('cut') || window.CUT || 'operator').replace(/[^a-z0-9_-]/gi, '') || 'operator';
    window.CUT = cut;
    document.write(`<script src="js/${cut === 'operator' ? 'timeline' : 'timeline-' + cut}.js"><\/script>`);
  })();
</script>
<script>
  (function () {
    const own = (window.TL && window.TL.scripts) || ['js/scenes/flow.js', 'js/chrome.js'];
    document.write(['js/geo.js', 'js/engine.js', 'js/kit.js', ...own].map(s => `<script src="${s}"><\/script>`).join(''));
  })();
</script>
<script>
  // Deterministic player: every frame is a pure function of t (seconds).
  // ?t=12.5 freezes a frame; ?play=1 previews in real time.
  E.init();
  const q = new URLSearchParams(location.search);
  if (q.get('play')) {
    const t0 = performance.now() - (parseFloat(q.get('t') || '0') * 1000);
    const tick = () => { E.seek(Math.min(E.total, (performance.now() - t0) / 1000)); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  } else {
    E.seek(parseFloat(q.get('t') || '0'));
  }
</script>
</body>
</html>
