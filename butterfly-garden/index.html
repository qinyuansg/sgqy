<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Butterfly Garden</title>
<style>
  :root { --bg: #140b24; --ink: #fff7fb; --accent: #ff7ac3; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: Fredoka, ui-rounded, system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; display: block; background: #000; }
  #play { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(20, 11, 36, 0.55);
    border: 0; color: inherit; cursor: pointer; font: inherit; }
  #play .btn { display: grid; place-items: center; gap: 14px; text-align: center; }
  #play .disc { width: 148px; height: 148px; border-radius: 50%; background: linear-gradient(135deg, #ff7ac3, #ffb24a);
    display: grid; place-items: center; box-shadow: 0 10px 40px rgba(255, 122, 195, 0.55); animation: pulse 1.6s ease-in-out infinite; }
  #play .disc::after { content: ""; margin-left: 12px; border-left: 54px solid #fff; border-top: 34px solid transparent; border-bottom: 34px solid transparent; }
  #play .label { font-size: 26px; letter-spacing: 0.02em; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5); }
  #play[hidden] { display: none; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  @media (prefers-reduced-motion: reduce) { #play .disc { animation: none; } }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080" aria-label="The Butterfly Garden animated story"></canvas></div>
<button id="play" aria-label="Play the story"><span class="btn"><span class="disc"></span><span class="label" id="label">Loading the magic…</span></span></button>
<script src="assets/sprites.js"></script>
<script src="js/core.js"></script>
<script src="js/scene.js"></script>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>
</body>
</html>
